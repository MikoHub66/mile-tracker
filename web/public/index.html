<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mile Tracker</title>
<meta name="description" content="Review, edit and report the drives recorded by the Mile Tracker phone app.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231f2a37'/%3E%3Cpath fill='%23fff' d='M17.3 7.6c-.2-.4-.5-.6-.9-.6H8.6c-.4 0-.7.2-.9.6L6 12v5.2c0 .4.3.8.8.8h.6c.4 0 .8-.4.8-.8v-.6h7.6v.6c0 .4.4.8.8.8h.6c.5 0 .8-.4.8-.8V12zM8.4 14.7a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm7.2 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM7.4 11.4l1-3h7.2l1 3z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <h1>Mile Tracker</h1>
    <p>Sign in with the same account you use in the phone app.</p>
    <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
    <label class="field"><span>Password</span><input name="pw" type="password" autocomplete="current-password" minlength="6" required></label>
    <div class="err" id="loginErr"></div>
    <button class="btn primary block" data-mode="in">Sign in</button>
    <button class="btn block" data-mode="up">Create account</button>
    <button type="button" class="link" id="resetPw">Forgot password?</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <header class="top">
    <div class="brand">
      <h1>Mile Tracker</h1>
      <div class="view-switch" role="tablist" aria-label="View">
        <button data-view="map" class="on" role="tab">Map</button>
        <button data-view="table" role="tab">Table</button>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn ghost" id="btnManual">+ Manual trip</button>
      <button class="btn ghost" id="btnVehicles">Vehicles</button>
      <button class="btn light" id="btnReport">Report / CSV</button>
      <button class="btn ghost small" id="btnSignOut" title="Sign out">Sign out</button>
    </div>
  </header>
  <div id="demoBar" class="demo-bar" hidden>Demo data. Firebase isn't connected yet, so edits stay in this browser. <button class="link" id="resetDemo">Reset demo</button></div>
  <div class="layout">
    <aside class="side">
      <div class="cal">
        <div class="cal-head">
          <button class="icon" id="prevMonth" aria-label="Previous month">‹</button>
          <b id="monthLabel"></b>
          <button class="icon" id="nextMonth" aria-label="Next month">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="month-stats" id="monthStats"></div>
      </div>
      <div class="day-head">
        <div><b id="dayLabel"></b><span id="dayMiles"></span></div>
        <div class="day-nav">
          <button class="icon" id="prevDay" aria-label="Previous day">‹</button>
          <input type="date" id="dayPick" aria-label="Pick a day">
          <button class="icon" id="nextDay" aria-label="Next day">›</button>
        </div>
      </div>
      <div class="filters">
        <label><input type="checkbox" id="wholeMonth"> Whole month on map</label>
        <label><input type="checkbox" id="showRemoved"> Show removed</label>
      </div>
      <div id="dayList" class="day-list"></div>
    </aside>
    <div id="map" class="map"></div>
  </div>

  <section id="tableView" class="table-view" hidden>
    <div class="tv-toolbar">
      <label class="tv-f"><span>Year</span><select id="tvYear"></select></label>
      <label class="tv-f"><span>Month</span><select id="tvMonth"></select></label>
      <label class="tv-f"><span>Use</span><select id="tvUse"></select></label>
      <label class="tv-f"><span>Vehicle</span><select id="tvVehicle"></select></label>
      <label class="tv-f"><span>Show</span><select id="tvShow">
        <option value="counted">Counted trips</option>
        <option value="all">All, incl. removed</option>
        <option value="removed">Removed only</option>
        <option value="review">Needs review</option>
      </select></label>
      <label class="tv-f grow"><span>Search</span><input id="tvSearch" type="search" placeholder="Address, notes…"></label>
      <button class="btn" id="tvExport" title="Every trip shown in the table, all columns">Export table CSV</button>
    </div>

    <div class="bulk" id="bulkBar">
      <b id="bulkCount">0 selected</b>
      <label class="tv-f"><span>Change</span><select id="bulkField">
        <option value="use">Use</option>
        <option value="vehicle">Vehicle</option>
        <option value="status">Counted / removed</option>
        <option value="notes">Notes</option>
        <option value="date">Date</option>
      </select></label>
      <label class="tv-f" id="bulkValueWrap"><span>To</span><span id="bulkValue"></span></label>
      <button class="btn primary" id="bulkSelected" disabled>Change selected</button>
      <button class="btn" id="bulkAll">Change all shown</button>
      <button class="btn danger" id="bulkDelete" disabled>Delete selected</button>
      <button class="link" id="bulkClear" hidden>Clear selection</button>
    </div>

    <div class="tv-scroll">
      <table class="tv" id="tvTable">
        <thead><tr>
          <th class="c-sel"><input type="checkbox" id="tvAll" aria-label="Select all shown"></th>
          <th data-sort="vehicle">Vehicle</th>
          <th data-sort="date">Date</th>
          <th data-sort="startTs">Start</th>
          <th data-sort="startAddress">Starting address</th>
          <th data-sort="endTs">End</th>
          <th data-sort="endAddress">Ending address</th>
          <th data-sort="miles" class="num">Miles</th>
          <th data-sort="use">Use</th>
          <th data-sort="excluded">Counted</th>
          <th data-sort="notes">Notes</th>
          <th></th>
        </tr></thead>
        <tbody id="tvBody"></tbody>
        <tfoot><tr><td></td><td colspan="6" id="tvFootLabel"></td><td class="num" id="tvFootMiles"></td><td colspan="4"></td></tr></tfoot>
      </table>
    </div>
  </section>
</div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
